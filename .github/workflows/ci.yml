name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  visual-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Compile TypeScript
        run: npm run build

      - name: Initialize Baseline Snapshot
        run: node dist/cli.js --mock --update-baseline

      - name: Verify Dynamic UI with Smart Masking
        run: node dist/cli.js --mock --dynamic